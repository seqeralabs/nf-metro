name: Clean up PR render preview

on:
  # pull_request_target runs in the base-repo context with a write token even
  # for fork PRs (a fork PR's pull_request token is read-only and cannot push
  # to gh-pages). Safe here: no PR-head code is checked out or run; the job only
  # removes a directory keyed by the integer PR number.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose preview directory to remove
        required: true

permissions:
  contents: write

# A concurrency group holds at most one pending run, so a newer entrant cancels
# the older pending one. Keyed per PR to keep an unrelated gh-pages writer from
# discarding a queued cleanup and leaving its preview directory behind forever.
concurrency:
  group: gh-pages-cleanup-${{ github.event.inputs.pr_number || github.event.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview directory
        env:
          PR: ${{ github.event.inputs.pr_number || github.event.number }}
        run: |
          set -euo pipefail
          if ! echo "$PR" | grep -qE '^[0-9]+$'; then
            echo "Refusing to act on non-numeric PR number '$PR'." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A rejected push means another gh-pages writer committed first. The
          # commit is re-derived on the refetched tip rather than replayed as a
          # diff, so a preview publish that rewrote this directory in between
          # cannot leave a conflict behind.
          for delay in 0 5 10 20 40; do
            sleep "$delay"
            git fetch --depth=1 origin gh-pages
            git reset --hard FETCH_HEAD
            if [ ! -d "_pr/$PR" ]; then
              echo "No preview directory found for PR #$PR, nothing to clean up."
              exit 0
            fi
            git rm -rf "_pr/$PR"
            git commit -m "Clean up render preview for PR #$PR"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
          done
          echo "Could not remove the preview for PR #$PR from gh-pages." >&2
          exit 1
