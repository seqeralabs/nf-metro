name: Playground e2e

on:
  pull_request:
    paths:
      - "website/public/playground/**"
      - "website/src/pages/playground.astro"
      - "website/playground-tests/**"
      - "src/nf_metro/**"
      - ".github/workflows/playground-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Build dev wheel for the playground
        run: |
          rm -rf website/public/playground/wheels
          uv build --wheel -o website/public/playground/wheels
          WHEEL=$(basename website/public/playground/wheels/*.whl)
          printf '{"wheel": "%s"}\n' "$WHEEL" > website/public/playground/wheels/index.json

      - name: Install nf-metro (the manifest generator imports build_gallery)
        run: uv sync --frozen --extra docs

      - name: Build playground example manifest
        run: uv run --frozen python scripts/build_playground_examples.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Playwright and Chromium
        working-directory: website/playground-tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: website/playground-tests
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            website/playground-tests/playwright-report/
            website/playground-tests/test-results/
          retention-days: 7
