name: Publish render preview

on:
  workflow_run:
    workflows: ["PR render preview"]
    types: [requested, completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'pull_request'
    outputs:
      artifact: ${{ steps.context.outputs.artifact }}
      pr: ${{ steps.context.outputs.pr }}
    steps:
      - name: Resolve workflow context
        id: context
        env:
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          pr="$PAYLOAD_PR"
          if [ -z "$pr" ]; then
            pr=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
              --jq 'map(select(.state == "open"))[0].number // empty')
          fi

          artifact=false
          if [ "$ACTION" = "completed" ]; then
            artifact_id=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?name=render-preview" \
              --jq '.artifacts[0].id // empty')
            if [ -n "$artifact_id" ]; then
              artifact=true
            fi
          fi

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  pending:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.action == 'requested'
    steps:
      - name: Mark preview as rendering
        if: needs.resolve.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: render-preview
          number: ${{ needs.resolve.outputs.pr }}
          message: |
            **Render preview**: :hourglass_flowing_sand: rendering in progress...

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A concurrency group holds at most ONE pending run: a newer entrant cancels
    # the older pending one. A group spanning PRs therefore drops previews under
    # a burst of pushes, so this one is keyed to the single PR whose head
    # repository and branch it belongs to.
    concurrency:
      group: >-
        gh-pages-preview-${{ github.event.workflow_run.head_repository.full_name
        }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.action == 'completed' &&
      needs.resolve.outputs.artifact == 'true'
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: render-preview
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read preview metadata
        id: meta
        run: |
          echo "pr=$(cat artifact/preview_meta/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "has_changes=$(cat artifact/preview_meta/has_changes.txt)" >> "$GITHUB_OUTPUT"

      # gh-pages must already exist; the docs deploy is what bootstraps it (and
      # what keeps the root .nojekyll in place), so there is no orphan-branch
      # fallback here.
      - name: Check out gh-pages
        if: steps.meta.outputs.has_changes == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          fetch-depth: 1
          path: gh-pages

      # A rejected push means another gh-pages writer committed first. The
      # commit is re-derived on the refetched tip rather than replayed as a diff,
      # so a cleanup that removed this directory in between cannot leave a
      # conflict behind.
      - name: Publish preview to gh-pages
        if: steps.meta.outputs.has_changes == 'true'
        working-directory: gh-pages
        env:
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          set -euo pipefail
          if ! echo "$PR" | grep -qE '^[0-9]+$'; then
            echo "Refusing to publish to non-numeric preview directory '$PR'." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for delay in 0 5 10 20 40; do
            sleep "$delay"
            git fetch --depth=1 origin gh-pages
            git reset --hard FETCH_HEAD
            rm -rf "_pr/$PR"
            mkdir -p "_pr/$PR"
            cp -a ../artifact/diff_site/. "_pr/$PR/"
            git add -A "_pr/$PR"
            if git diff --staged --quiet; then
              echo "Preview for PR #$PR is already published verbatim."
              exit 0
            fi
            git commit -m "Publish render preview for PR #$PR"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
          done
          echo "Could not push the preview for PR #$PR to gh-pages." >&2
          exit 1

      # A push to gh-pages only updates the branch; GitHub Pages then builds and
      # publishes it asynchronously. Poll until the URL serves the page carrying
      # THIS render run's marker, so an existing preview's stale content can't be
      # mistaken for the new one and the announced link is never stale or a 404.
      - name: Wait for preview to be published
        id: wait
        if: steps.meta.outputs.has_changes == 'true'
        env:
          URL: https://${{ github.repository_owner }}.github.io/nf-metro/_pr/${{ steps.meta.outputs.pr }}/index.html
          MARKER: ${{ github.event.workflow_run.id }}
        run: |
          live=false
          for i in $(seq 1 20); do
            body=$(curl -sS "${URL}?cb=${{ github.run_id }}-${i}" 2>/dev/null || true)
            if printf '%s' "$body" | grep -qF "nf-metro-render-run\" content=\"${MARKER}\""; then
              live=true; break
            fi
            echo "attempt ${i}: marker ${MARKER} not live yet"
            sleep 15
          done
          echo "live=${live}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR (preview live)
        if: steps.meta.outputs.has_changes == 'true' && steps.wait.outputs.live == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: render-preview
          number: ${{ steps.meta.outputs.pr }}
          message: |
            **Render preview** is ready for review:
            :framed_picture: https://${{ github.repository_owner }}.github.io/nf-metro/_pr/${{ steps.meta.outputs.pr }}/

            This preview shows only the renders that changed compared to `main`.

      - name: Comment on PR (preview still publishing)
        if: steps.meta.outputs.has_changes == 'true' && steps.wait.outputs.live != 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: render-preview
          number: ${{ steps.meta.outputs.pr }}
          message: |
            **Render preview**: :hourglass_flowing_sand: rendered and pushed; GitHub Pages is still publishing it. The link will work shortly:
            :framed_picture: https://${{ github.repository_owner }}.github.io/nf-metro/_pr/${{ steps.meta.outputs.pr }}/

            This preview shows only the renders that changed compared to `main`.

      - name: Comment on PR (no changes)
        if: steps.meta.outputs.has_changes == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: render-preview
          number: ${{ steps.meta.outputs.pr }}
          message: |
            **Render preview**: no visual changes detected. All renders match `main`.

      # Without this the PR keeps the "rendering in progress" marker and the only
      # trace of the failure is a red run nobody is watching.
      - name: Comment on PR (publish failed)
        if: failure() && needs.resolve.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: render-preview
          number: ${{ needs.resolve.outputs.pr }}
          message: |
            **Render preview** was rendered but could not be published.
            Inspect the [publish run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

  failed:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.action == 'completed' &&
      needs.resolve.outputs.artifact != 'true'
    steps:
      - name: Report preview failure
        if: needs.resolve.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: render-preview
          number: ${{ needs.resolve.outputs.pr }}
          message: |
            **Render preview** was not generated because a prerequisite check or the render job failed.
            Inspect the [workflow run](${{ github.event.workflow_run.html_url }}) for details.
