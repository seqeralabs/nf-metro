name: Docs link check

# Builds the Astro site on pull requests so starlight-links-validator runs and
# fails the PR on a broken internal link, rather than only surfacing it when the
# post-merge deploy (docs.yml) builds and fails.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "examples/**"
      - "scripts/build_gallery.py"
      - "scripts/gallery.yaml"
      - ".github/workflows/docs-links.yml"

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install nf-metro (gallery generator + render CLI)
        run: uv sync --frozen --extra docs

      - name: Build gallery + pipelines content
        run: uv run --frozen python scripts/build_gallery.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install npm dependencies
        working-directory: website
        run: npm ci

      - name: Build site (runs starlight-links-validator)
        working-directory: website
        run: npm run build

      - name: Check <Metro> raster/video exports landed in the build output
        working-directory: website
        run: |
          for ext in png gif webp mp4 webm; do
            if ! ls dist/_generated/metro/*."$ext" >/dev/null 2>&1; then
              echo "::error::no .$ext file under dist/_generated/metro/ - a <Metro format=\"$ext\"> export didn't survive the build" >&2
              exit 1
            fi
          done
