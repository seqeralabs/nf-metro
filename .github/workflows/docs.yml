name: Deploy docs

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# A concurrency group holds at most one pending run, so a newer entrant cancels
# the older pending one. Release deploys therefore get a per-tag group, isolated
# from each other and from dev deploys: a push (or another release) can never
# cancel a pending release deploy, and the monotonic `latest` guard in
# update_versions_manifest.py keeps two releases racing to gh-pages from
# demoting `latest`. Dev deploys (push/workflow_dispatch) share one group so a
# later push supersedes a stale queued dev rebuild.
concurrency:
  group: >-
    ${{ github.event_name == 'release'
        && format('gh-pages-docs-release-{0}', github.ref_name)
        || 'gh-pages-docs-dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install nf-metro (gallery generator + wheel build)
        run: pip install -e ".[docs]" build

      # --- Generate dynamic content into the Astro project ---
      - name: Build playground wheel
        # The service worker caches .whl files by name as immutable. The dev
        # wheel's version is static, so stamp a content hash into the wheel
        # build tag: the filename then changes whenever the wheel does, so a
        # returning visitor's cached copy is superseded instead of served stale.
        run: |
          rm -rf website/public/playground/wheels
          python -m build --wheel -o website/public/playground/wheels
          cd website/public/playground/wheels
          orig=$(basename ./*.whl)
          hash=$(sha256sum "$orig" | cut -c1-12)
          wheel=$(echo "$orig" | sed -E "s/^([^-]+-[^-]+)-/\1-0$hash-/")
          mv "$orig" "$wheel"
          printf '{"wheel": "%s"}\n' "$wheel" > index.json

      - name: Write playground build info
        run: |
          printf '{"sha": "%s"}\n' "$GITHUB_SHA" > website/public/playground/build-info.json

      - name: Build playground example manifest
        run: python scripts/build_playground_examples.py

      - name: Build gallery + pipelines (render SVGs, generate pages)
        run: python scripts/build_gallery.py

      # --- Build the Astro / Starlight site ---
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install npm dependencies
        working-directory: website
        run: npm ci

      # --- Resolve deploy target ---
      # main push -> dev/ ; tagged release -> latest/ plus a frozen <version>/.
      - name: Resolve deploy target
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Publish to gh-pages ---
      # Each version is its own directory, built with a matching `base` (via
      # DOCS_BASE) so its asset and link URLs self-resolve. The deploy only
      # replaces its own target directory, leaving PR previews (_pr/), other
      # versions, and the frozen pre-Astro MkDocs builds untouched. versions.json
      # at the root drives the in-page version switcher.
      - name: Publish to gh-pages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          IS_RELEASE: ${{ steps.ver.outputs.is_release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages
          fi

          # Built outside the gh-pages worktree so the commit can be re-derived
          # from the build output after a rejected push, without rebuilding.
          build_into() {
            (cd website && DOCS_BASE="$1" npm run build)
            rm -rf "$2"
            mkdir -p "$2"
            cp -a website/dist/. "$2/"
          }

          if [ "$IS_RELEASE" = "true" ]; then
            build_into "/nf-metro/latest/"   /tmp/site/latest
            build_into "/nf-metro/$VERSION/" "/tmp/site/$VERSION"
            targets="latest $VERSION"
          else
            build_into "/nf-metro/dev/" /tmp/site/dev
            targets="dev"
          fi

          # Root redirects to the latest stable release, not the in-progress dev build.
          cat > /tmp/site/root-index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <title>Redirecting</title>
              <noscript><meta http-equiv="refresh" content="1; url=latest/" /></noscript>
              <script>
                window.location.replace("latest/" + location.search + location.hash);
              </script>
            </head>
            <body>Redirecting to <a href="latest/">latest/</a>...</body>
          </html>
          HTML

          derive() {
            for target in $targets; do
              rm -rf "gh-pages/$target"
              mkdir -p "gh-pages/$target"
              cp -a "/tmp/site/$target/." "gh-pages/$target/"
            done
            if [ "$IS_RELEASE" = "true" ]; then
              python scripts/update_versions_manifest.py \
                --manifest gh-pages/versions.json --version "$VERSION" --latest
            else
              python scripts/update_versions_manifest.py \
                --manifest gh-pages/versions.json --version dev
            fi
            cp /tmp/site/root-index.html gh-pages/index.html
            touch gh-pages/.nojekyll
            git -C gh-pages add -A
          }

          # A rejected push means another gh-pages writer committed first. The
          # commit is re-derived on the refetched tip rather than replayed as a
          # diff, so a sibling writer that touched the same path cannot leave a
          # conflict behind, and the number of local commits never matters.
          for delay in 0 5 10 20 40; do
            sleep "$delay"
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git -C gh-pages fetch --depth=1 origin gh-pages
              git -C gh-pages reset --hard FETCH_HEAD
            fi
            # Called as a plain command, not in a condition: a condition would
            # suppress `set -e` for everything inside it.
            derive
            if git -C gh-pages diff --staged --quiet; then
              echo "No changes to publish."
              exit 0
            fi
            git -C gh-pages commit -m "docs: deploy ${VERSION} (${GITHUB_SHA::8})"
            if git -C gh-pages push origin HEAD:gh-pages; then
              exit 0
            fi
          done
          echo "Could not push the ${VERSION} docs build to gh-pages." >&2
          exit 1
