name: Publish to PyPI

on:
  release:
    types: [published]

# No workflow-level id-token: only the publish job needs it (scoped below).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        # No cache on a release build: it feeds a published artifact, so it must
        # not restore anything a prior run could have poisoned.
        with:
          enable-cache: false
      - run: uv build

      # PyPI takes the version from the artefact, not the tag, so a tag cut
      # against an unbumped tree would publish under the previous version.
      # A wheel filename carries the PEP 427 normalised version, so the two
      # sides are compared as parsed versions rather than as strings.
      - name: Check the release tag matches the built version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import glob
          import os
          import sys
          from packaging.version import InvalidVersion, Version

          wheels = sorted(glob.glob("dist/*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")

          built = os.path.basename(wheels[0]).split("-")[1]
          tag = os.environ["TAG"]
          try:
              match = Version(built) == Version(tag.removeprefix("v"))
          except InvalidVersion as error:
              sys.exit(f"cannot compare release tag {tag!r} with built version {built!r}: {error}")
          if not match:
              sys.exit(f"release tag {tag} does not match built version {built}")
          print(f"release tag {tag} matches built version {built}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    # Scoped here, not workflow-wide: only this job mints the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      # Trusted publishing: uv reads the GitHub OIDC token (id-token: write) and
      # needs no API token. Requires a PyPI trusted publisher for this workflow.
      - run: uv publish --trusted-publishing always dist/*
