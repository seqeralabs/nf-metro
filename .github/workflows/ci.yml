name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy

  skill-selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The checker validates the fix-issue skill's internal consistency: link
      # resolution, agent-definition/tier-table agreement, shell parsing in both
      # shells, script self-tests and the post-compaction token budget. Without
      # this job a future edit can break any of them while the rest of CI is green.
      - run: pip install -e ".[skill-checks]"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - run: python .claude/skills/fix-issue/scripts/check_skill.py
        env:
          # With a key the token budget is measured exactly via count_tokens.
          # Without one the checker falls back to a scaled tiktoken proxy, which
          # is conservative rather than wrong, so this secret is optional.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Runs the prettier hook from prek.toml (web/docs files; Python is handled
      # by ruff in the lint job). prek auto-provisions node + prettier + the astro
      # plugin; --show-diff-on-failure (added by the action) prints what needs
      # formatting.
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: prettier --all-files

  test:
    needs: [lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # The supported bounds only: requires-python's floor and the newest
        # release. A break that hits 3.12 or 3.13 alone, and neither end, is
        # rare enough not to be worth tripling the matrix for.
        python-version: ["3.11", "3.14"]
        split: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,font]"
      - run: >-
          pytest --splits 3 --group ${{ matrix.split }}
          --splitting-algorithm least_duration --durations=25
          --ignore=tests/test_routing_gate_coverage.py

  wheel-smoke:
    name: Wheel smoke test (Python 3.12)
    needs: [lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      # Package data lives under src/nf_metro but is not Python, so nothing
      # imports it and a build-config slip drops it silently.
      - name: Check the wheel ships its package data and no internal docs
        run: |
          contents=$(python -m zipfile -l dist/*.whl)
          for path in \
            nf_metro/py.typed \
            nf_metro/fonts/Inter-Regular.woff2 \
            nf_metro/fonts/Inter-Bold.woff2 \
            nf_metro/fonts/LICENSE.txt \
            nf_metro/live/state_schema.json \
            nf_metro/manifest/schema.json \
            nf_metro/render/driver.js \
            nf_metro/render/inline.html \
            nf_metro/render/standalone.html
          do
            grep -qF "$path" <<<"$contents" || { echo "wheel is missing $path"; exit 1; }
          done
          ! grep -qF "CONTRACT.md" <<<"$contents" || { echo "wheel ships CONTRACT.md"; exit 1; }

      # A venv and a working directory both outside the checkout: an import that
      # only resolves because src/ is on the path, or a resource addressed by a
      # repo-relative path, fails here and nowhere else in CI.
      - name: Render an example from a clean venv outside the repo
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/nf-metro" --version
          "$RUNNER_TEMP/smoke/bin/nf-metro" --help
          "$RUNNER_TEMP/smoke/bin/nf-metro" render \
            "$GITHUB_WORKSPACE/examples/simple_pipeline.mmd" -o smoke.svg
          test -s smoke.svg

  routing-gates:
    name: Routing gate coverage (Python 3.11)
    needs: [lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,font]"
      - run: pytest -n 0 tests/test_routing_gate_coverage.py
        env:
          NF_METRO_REQUIRE_GATE_COVERAGE: "1"
