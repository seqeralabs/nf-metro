name: PR render preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # Incremental only when every changed file is a fixture .mmd; any other
      # change (engine code, build scripts, deps, docs) renders the full corpus,
      # so an engine change can never hide behind a reused base SVG.
      - name: Determine render strategy
        id: strategy
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          echo "render_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          base_render_key="$(
            git ls-tree -r "$base" -- \
              pyproject.toml src scripts/build_gallery.py scripts/gallery.yaml \
              examples tests/fixtures tests/layout_metrics.py \
              | git hash-object --stdin
          )"
          echo "base_render_key=$base_render_key" >> "$GITHUB_OUTPUT"
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files:"; echo "$changed"
          allowed='^(examples/|tests/fixtures/).*\.mmd$'
          if [ -n "$changed" ] && [ -z "$(printf '%s\n' "$changed" | grep -vE "$allowed" || true)" ]; then
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
            echo "Render mode: INCREMENTAL"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Render mode: FULL"
          fi
          printf '%s\n' "$changed" > /tmp/changed_mmd.txt

      # Only files that can affect gallery output belong in the cache key. A base
      # branch update that changes unrelated files can reuse the rendered corpus.
      - name: Cache base renders
        id: base-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/base_renders
          key: render-base-${{ steps.strategy.outputs.base_render_key }}

      - name: Install (PR head)
        run: uv sync --extra docs

      - name: Render base
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          git checkout '${{ github.event.pull_request.base.sha }}'
          uv sync --extra docs
          uv run --no-sync python scripts/build_gallery.py --debug
          mkdir -p /tmp/base_renders
          cp docs/assets/renders/*.svg docs/assets/renders/manifest.json /tmp/base_renders/
          cp docs/assets/renders/metrics.json /tmp/base_renders/ 2>/dev/null || true
          git checkout '${{ steps.strategy.outputs.render_ref }}'
          uv sync --extra docs

      - name: Render PR head
        run: |
          rm -rf docs/assets/renders
          mkdir -p docs/assets/renders
          if [ "${{ steps.strategy.outputs.mode }}" = "incremental" ]; then
            cp -r /tmp/base_renders/. docs/assets/renders/
            uv run --no-sync python scripts/build_gallery.py --debug --changed-list /tmp/changed_mmd.txt
          else
            uv run --no-sync python scripts/build_gallery.py --debug
          fi
          mkdir -p /tmp/pr_renders
          cp docs/assets/renders/*.svg docs/assets/renders/manifest.json /tmp/pr_renders/
          cp docs/assets/renders/metrics.json /tmp/pr_renders/ 2>/dev/null || true

      - name: Generate render diff
        id: diff
        run: |
          set +e
          uv run --no-sync python scripts/build_render_diff.py \
            /tmp/base_renders /tmp/pr_renders /tmp/diff_site \
            --pr ${{ github.event.number }} \
            --marker ${{ github.run_id }}
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            exit $EXIT_CODE
          fi

      # A fork PR's GITHUB_TOKEN is read-only, so this job cannot deploy Pages or
      # comment. Hand the site plus the publish decision to pr-render-publish.yml,
      # which runs from the base repo with a write token via workflow_run.
      - name: Stage preview metadata
        run: |
          mkdir -p /tmp/diff_site /tmp/preview_meta
          echo "${{ github.event.number }}" > /tmp/preview_meta/pr_number.txt
          echo "${{ steps.diff.outputs.has_changes }}" > /tmp/preview_meta/has_changes.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-preview
          path: |
            /tmp/diff_site
            /tmp/preview_meta
          retention-days: 3
