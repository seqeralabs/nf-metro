[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nf-metro"
version = "2.0.0"
description = "Generate metro-map-style SVG diagrams from Mermaid graph definitions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jonathan Manning", email = "jonathan.manning@seqera.io" }]
maintainers = [{ name = "Jonathan Manning", email = "jonathan.manning@seqera.io" }]
keywords = [
    "nextflow",
    "nf-core",
    "bioinformatics",
    "visualization",
    "metro-map",
    "mermaid",
    "svg",
    "pipeline",
    "workflow",
    "diagram",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "click>=8.0",
    "drawsvg>=2.0",
    "lark>=1.1",
    "networkx>=3.0",
    "pillow>=9.0",
    "resvg-py>=0.5",
]

[project.urls]
Homepage = "https://github.com/seqeralabs/nf-metro"
Documentation = "https://seqeralabs.github.io/nf-metro/latest/"
Repository = "https://github.com/seqeralabs/nf-metro"
Issues = "https://github.com/seqeralabs/nf-metro/issues"

[project.scripts]
nf-metro = "nf_metro.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-split>=0.9",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-networkx",
    "numpy<2.5",
    "nf-metro[validate]",
    # Pinned so the frozen PNG hash in tests/test_hash_seed_determinism.py has
    # one rasteriser build to lock against; runtime accepts any >=0.5.
    "resvg-py==0.5.0",
]
# Docs site is Astro/Starlight (see website/package.json). This extra only
# provides pyyaml, for the gallery corpus map.
docs = [
    "pyyaml>=6.0",
]
font = [
    "fonttools[woff]>=4.0",
]
# `nf-metro validate-svg` validates an SVG's embedded manifest against a Draft
# 2020-12 schema, which jsonschema only implements from 4.0.
validate = [
    "jsonschema>=4.0",
]

# The skill self-check needs pyyaml for the gallery corpus map, and a tokenizer to
# gate SKILL.md against Claude Code's post-compaction re-attachment cap. `anthropic`
# is the correct instrument (count_tokens knows Claude's tokenizer); tiktoken is a
# fallback that undercounts Claude by 15-20% and is scaled accordingly.
skill-checks = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "tiktoken>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nf_metro"]
# Both live under the package directory but have no importer or reader at
# runtime: the candidate executor is a harness driven from the test suite and a
# source checkout, and CONTRACT.md is the layout pipeline's stage-by-stage
# design record, cited only from comments and the test suite.
exclude = [
  "src/nf_metro/candidate_executor.py",
  "src/nf_metro/layout/CONTRACT.md",
]

[tool.hatch.build.targets.sdist]
# Ship what is needed to build and audit the package: src, packaging metadata,
# README/LICENSE/CHANGELOG. Everything below is development or CI material that
# no installing user needs. `tests` and `examples` are excluded together because
# 31 test modules read fixtures out of `examples/`.
exclude = [
  "datasets",
  "tests",
  "examples",
  "docs",
  "website",
  "scripts",
  ".claude",
  ".github",
  ".test_durations",
  "CLAUDE.md",
  "DESIGN.md",
  "prek.toml",
  ".pre-commit-config.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
xfail_strict = true
addopts = "-rxX -n auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ANN", "C901"]

[tool.ruff.lint.mccabe]
# Keep function branch complexity readable; functions above this are
# decomposed into named helpers rather than allowed to grow.
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
# Type-annotation rules are enforced on the library only; tests favour
# brevity over fully annotated fixtures and helpers.
"tests/**" = ["ANN"]
"scripts/**" = ["ANN"]
# Self-contained triage tooling: emits long literal HTML/JS template lines
# (wrapping them would distort the produced markup) and favours brevity over
# fully annotated engine-glue helpers, matching the scripts/ convention.
".claude/skills/nf-metro-layout-triage/build_review.py" = ["E501", "ANN"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.11"
ignore_missing_imports = false
strict_optional = true
disallow_any_generics = true

# drawsvg ships no type information; jsonschema is an optional dependency (the
# `validate` extra) imported lazily by `nf-metro validate-svg`. Everything else
# (click, Pillow, networkx via types-networkx) is typed once the package is
# installed.
[[tool.mypy.overrides]]
module = ["drawsvg", "jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fontTools", "fontTools.*"]
ignore_missing_imports = true

# Fully-annotated core: the data model and the layout phases pass data
# between split modules, so require complete signatures there.
[[tool.mypy.overrides]]
module = ["nf_metro.parser.model", "nf_metro.layout.phases.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
