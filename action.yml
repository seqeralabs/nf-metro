name: nf-metro
description: Render a metro-map SVG from a Mermaid .mmd source and report whether the committed SVG is out of date.
author: Seqera

branding:
  icon: map
  color: purple

inputs:
  input:
    description: Path to the Mermaid .mmd source to render.
    required: false
    default: assets/metro_map.mmd
  output:
    description: >-
      Path for the rendered SVG. If empty, will use paths specified with '%%metro output'
      or write a SVG next to the .mmd file. Input can take multiple whitespace-separated
      paths, taking each format from its extension (e.g. "assets/metro_map.svg assets/metro_map.png").
    required: false
    default: ""
  theme:
    description: "Visual theme (nfcore, seqera, ...)."
    required: false
    default: nfcore
  mode:
    description: >-
      Display mode to bake (light or dark). Leave empty to keep the theme's own
      default and emit an adaptive light-dark() SVG.
    required: false
    default: ""
  embed-font:
    description: Inline the label font into the SVG so it renders standalone.
    required: false
    default: "true"
  version:
    description: >-
      nf-metro version to install (e.g. 2.1.0). Leave empty to install the
      version this action release was cut with, so `@X.Y.Z` installs
      nf-metro X.Y.Z for reproducible renders.
    required: false
    default: ""
  extra-args:
    description: Additional flags passed verbatim to `nf-metro render`.
    required: false
    default: ""

outputs:
  output-path:
    description: The path(s) the map was written to, one per line.
    value: ${{ steps.render.outputs.output-path }}
  changed:
    description: "'true' when any rendered output differs from the committed version, otherwise 'false'."
    value: ${{ steps.render.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

    - name: Install nf-metro
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        version="$VERSION"
        if [ -z "$version" ]; then
          # Default to the version this action release ships with (the
          # pyproject.toml checked out at the action's ref), so `@X.Y.Z`
          # installs nf-metro X.Y.Z rather than whatever is latest on PyPI.
          version="$(grep -m1 '^version = ' "$ACTION_PATH/pyproject.toml" | sed -E 's/.*"([^"]+)".*/\1/')"
        fi
        uv tool install "nf-metro==$version"

    - name: Render metro map
      id: render
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.input }}
        OUTPUT_PATH: ${{ inputs.output }}
        THEME: ${{ inputs.theme }}
        MODE: ${{ inputs.mode }}
        EMBED_FONT: ${{ inputs.embed-font }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail

        args=(render "$INPUT_PATH" --theme "$THEME")

        # Each whitespace-separated 'output' value becomes its own -o (repeat -o
        # to write several formats from one input). When empty, the CLI resolves
        # its own outputs (%%metro output: in the .mmd, else the sibling .svg).
        if [ -n "$OUTPUT_PATH" ]; then
          # shellcheck disable=SC2206
          outs=($OUTPUT_PATH)
          for out in "${outs[@]}"; do
            args+=(-o "$out")
          done
        fi

        if [ -n "$MODE" ]; then
          args+=(--mode "$MODE")
        fi

        if [ "$EMBED_FONT" = "true" ]; then
          args+=(--embed-font)
        else
          args+=(--no-embed-font)
        fi

        # Split EXTRA_ARGS on whitespace (word-splitting is intentional here).
        if [ -n "$EXTRA_ARGS" ]; then
          # shellcheck disable=SC2206
          extra=($EXTRA_ARGS)
          args+=("${extra[@]}")
        fi

        # nf-metro prints a YAML document to stdout
        render_out="$(nf-metro "${args[@]}")"

        # Read the outputs list with yq. pipefail makes a missing yq or parse error abort.
        outputs_list="$(printf '%s\n' "$render_out" | yq '.outputs[]')"
        rendered=()
        while IFS= read -r p; do
          [ -n "$p" ] && rendered+=("$p")
        done <<< "$outputs_list"

        {
          echo "output-path<<EOF"
          printf '%s\n' "${rendered[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        if [ -z "$(git status --porcelain -- "${rendered[@]}" 2>/dev/null)" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
