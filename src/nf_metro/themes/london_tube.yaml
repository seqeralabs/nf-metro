# yaml-language-server: $schema=theme.schema.json
# A schematic-transit look after the geometry of TfL's Line Diagram Standard,
# which measures everything in multiples of the line width: tabs for stations
# on one line, a bar across a line's end, bold capsules at interchanges,
# bundled lines edge to edge (so no track_gap), unboxed sections and a
# humanist sans in navy. Also the worked example of the theme file format.
name: london-tube

# Track-weight tabs rather than the standard's 0.66 square: 1 line width thick
# and reaching 1.5 past the line, a tab reads as a continuation of the track.
# The terminus bar matches it.
station_glyph: tick
station_tick_width: 1
station_tick_length: 1.5
# `interchange_glyph: ring` draws the standard's rings (a 2-wide inside, a
# 0.5-wide outline, chains bridged by a 0.5-wide strip): one ring over two
# lines, a bridged chain over three or more.
interchange_glyph: pill
ring_max_lines: 2
terminus_glyph: bar
icon_fill: "#ffffff"
icon_stroke: "#000000"
# Bold capsules: a 2.5px outline on 4px lines.
station_stroke_width: 2.5
line_width: 4
label_font_family: "'Gill Sans', 'Gill Sans MT', 'Hammersmith One', Calibri, 'Trebuchet MS', sans-serif"
label_font_weight: normal
section_stroke_width: 1.5
section_stroke_dasharray: "6 4"
number_sections: false
section_label_font_size: 13
section_label_font_weight: normal
uppercase_section_labels: true
section_label_letter_spacing: 2
legend_stroke_width: 1.5
legend_corner_radius: 0

light:
  background_fill: "#ffffff"
  label_color: "#1c3f94"
  title_color: "#000000"
  marker_stroke: "#000000"
  station_fill: "#ffffff"
  station_stroke: "#000000"
  muted_line_color: "#b3b3b3" # inactive lines in 30% grey
  section_fill: transparent
  section_stroke: "#8b919c"
  section_label_color: "#7a8291"
  legend_fill: "#ffffff"
  legend_text_color: "#111111"
  legend_stroke: "#000000"

dark:
  background_fill: "#10141c"
  label_color: "#dfe6ff"
  title_color: "#ffffff"
  marker_stroke: "#f0f0f0"
  station_fill: "#10141c"
  station_stroke: "#ffffff"
  muted_line_color: "#585a60"
  section_fill: transparent
  section_stroke: "#5f6779"
  section_label_color: "#9aa3b5"
  legend_fill: "#10141c"
  legend_text_color: "#e6e6e6"
  legend_stroke: "#ffffff"
