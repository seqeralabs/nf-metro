# A schematic-transit look: ticks for stations served by one line, white
# interchange capsules with a heavy outline, unboxed sections and a humanist
# sans in navy. Also the worked example of the theme file format.
name: london-tube

station_glyph: tick
station_tick_length: 6
station_fill: "#ffffff"
station_stroke: "#000000"
station_stroke_width: 2.5
line_width: 4
label_font_family: "'Gill Sans', 'Gill Sans MT', 'Hammersmith One', Calibri, 'Trebuchet MS', sans-serif"
label_font_weight: normal
section_stroke_width: 1
section_stroke_dasharray: "2 4"
section_badges: false
section_label_font_size: 13
section_label_font_weight: normal
section_label_uppercase: true
section_label_letter_spacing: 2
legend_stroke_width: 1.5
legend_corner_radius: 0

light:
  background_color: "#ffffff"
  label_color: "#1c3f94"
  title_color: "#000000"
  marker_stroke: "#000000"
  section_fill: transparent
  section_stroke: "#c9cdd6"
  section_label_color: "#7a8291"
  legend_background: "#ffffff"
  legend_text_color: "#111111"
  legend_stroke: "#000000"

dark:
  background_color: "#10141c"
  label_color: "#dfe6ff"
  title_color: "#ffffff"
  marker_stroke: "#f0f0f0"
  section_fill: transparent
  section_stroke: "#3a4152"
  section_label_color: "#9aa3b5"
  legend_background: "#10141c"
  legend_text_color: "#e6e6e6"
  legend_stroke: "#ffffff"
