# yaml-language-server: $schema=theme.schema.json
# One palette on a transparent canvas, for embedding in a page that supplies
# its own background. It renders the same whatever mode is asked for.
name: transparent
fixed_mode: dark

background_color: "none"
station_fill: "#ffffff"
station_stroke: "#333333"
station_radius: 6
station_stroke_width: 2
line_width: 3
label_color: "#333333"
label_font_family: "'Helvetica Neue', Helvetica, Arial, sans-serif"
label_font_size: 14
label_font_weight: "bold"
title_color: "#111111"
title_font_size: 26
section_fill: "#ededed"
section_stroke: "#e6e6e6"
section_label_color: "#666666"
section_label_font_size: 17
legend_background: "rgba(255, 255, 255, 0.8)"
legend_text_color: "#333333"
legend_font_size: 16
animation_ball_stroke: "#333333"
animation_ball_stroke_width: 1.5
marker_stroke: "" # outline markers with station_stroke
