# yaml-language-server: $schema=theme.schema.json
# Seqera brand (brand.seqera.io): Dark Brand #201637 for text and strokes,
# Deep Green #065647 for section labels, Medium Grey #cfd0d1 for borders,
# Soft Grey #f7f7f7 for section fills. Brand Green #31C9AC is never used for
# text, so it is left to the metro lines. Inter is the brand's body face;
# Degular (display) and JetBrains Mono (code) are not used because a theme
# sets one font stack for all text.
name: seqera

station_fill: "#ffffff"
station_stroke: "#201637"
station_stroke_width: 2
line_width: 4
label_font_family: "'Inter Variable', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
label_font_size: 14
label_font_weight: "600"
title_font_size: 26
section_label_font_size: 17
legend_font_size: 16
animation_ball_stroke: "#201637"
animation_ball_stroke_width: 1.5

# Brand Green and a lifted brand purple lead. Amber, blue and coral follow so
# lines bundled side by side stay distinguishable; Deep Green and Dark Brand
# come last because they read as near-black next to each other.
line_colors:
  ["#31C9AC", "#6b4fd8", "#f2a31b", "#2f80ed", "#e5484d", "#065647", "#201637"]

light:
  background_fill: "#ffffff"
  label_color: "#201637"
  title_color: "#201637"
  section_fill: "#f7f7f7"
  section_stroke: "#cfd0d1"
  section_label_color: "#065647"
  legend_fill: "rgba(255, 255, 255, 0.9)"
  legend_text_color: "#201637"
  marker_stroke: "#201637"

dark:
  line_colors:
    ["#31C9AC", "#a995ff", "#ffb84d", "#5eb4ff", "#ff7a7f", "#8fe3d1", "#ffffff"]
  background_fill: "#201637"
  label_color: "#ffffff"
  title_color: "#ffffff"
  section_fill: "#2b2144"
  section_stroke: "#3f3559"
  section_label_color: "#cfd0d1"
  legend_fill: "rgba(32, 22, 55, 0.85)"
  legend_text_color: "#ffffff"
  marker_stroke: "#cfd0d1"
