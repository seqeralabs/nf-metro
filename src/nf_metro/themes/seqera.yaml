# yaml-language-server: $schema=theme.schema.json
# Seqera brand (brand.seqera.io). Dark Brand #201637 is the text and stroke
# color, Deep Green #065647 the section label, Medium Grey #cfd0d1 the border
# and Soft Grey #f7f7f7 the section fill. Brand Green #31C9AC is decorative
# only (section badges, animation ball, the lead line color), never text, and
# carries Dark Brand on top of it. Inter is the brand's body face; Degular
# (display) and JetBrains Mono (code) are not used because a theme sets one
# font stack for all text.
name: seqera

station_fill: "#ffffff"
station_stroke: "#201637"
station_stroke_width: 2
line_width: 4
label_font_family: "'Inter Variable', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
label_font_size: 14
label_font_weight: "600"
title_font_size: 26
section_label_font_size: 17
legend_font_size: 16
animation_ball_color: "#31C9AC"
animation_ball_stroke: "#201637"
section_badge_fill: "#31C9AC"
section_badge_text_color: "#201637"
animation_ball_stroke_width: 1.5

# Brand colors only, ordered so similar ones (the two greens, the two
# near-blacks) never sit next to each other; lines past the list get
# generated colors.
line_colors: ["#31C9AC", "#7b6ea6", "#201637", "#a99bd6", "#065647"]

light:
  background_fill: "#ffffff"
  label_color: "#201637"
  title_color: "#201637"
  section_fill: "#e2f7f3"
  section_stroke: "#cfd0d1"
  section_label_color: "#065647"
  legend_fill: "rgba(255, 255, 255, 0.9)"
  legend_text_color: "#201637"
  marker_stroke: "#201637"

dark:
  line_colors: ["#31C9AC", "#a79bd0", "#3f8f7f", "#ffffff", "#7fe3cf"]
  background_fill: "#201637"
  label_color: "#ffffff"
  title_color: "#ffffff"
  section_fill: "#2b2144"
  section_stroke: "#3f3559"
  section_label_color: "#cfd0d1"
  legend_fill: "rgba(32, 22, 55, 0.85)"
  legend_text_color: "#ffffff"
  marker_stroke: "#cfd0d1"
