# Settings shared by every terminal screenshot in docs/. Each image is defined
# where it is used, as a markdown image whose alt-text is the command:
#
#   ![`nf-metro --help`](assets/img/nf-metro-help.svg)
#
# Regenerated by .github/workflows/rich-codex.yml. Run locally with:
#   pip install rich-codex && rich-codex --search-include 'docs/**/*.md*'
#
# An image whose command takes a repo path also needs `working_dir: .`: a
# markdown-defined command otherwise runs in the markdown file's own directory.

# The default 5s is close to a cold run's import + render time.
timeout: 30

# Output is captured through a pipe, not a pty, so colour has to be forced.
# TERMINAL_WIDTH is the column rich-click and nf_metro.console wrap at; the
# image is then trimmed to fit, so it also sets the width rich-codex draws.
extra_env:
  FORCE_COLOR: "1"
  TERMINAL_WIDTH: "90"

outputs:
  # The guide's typo example is defined here rather than in the markdown: it
  # needs a map with a deliberate typo, which can't be committed under
  # examples/ without the topology suites picking it up, and prettier rewrites
  # a multi-line {/* */} comment in an .mdx as prose.
  - command: nf-metro validate map.mmd
    before_command: |
      printf '%s\n' \
        '%%metro line: qc | QC | #2db572' \
        '%%metro off_track: sample_shet' \
        'graph LR' \
        '    samplesheet[Samplesheet] -->|qc| fastqc[FastQC]' > map.mmd
    after_command: rm -f map.mmd
    img_paths:
      - docs/assets/img/nf-metro-validate.svg
